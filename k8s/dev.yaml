---
apiVersion: v1
kind: Namespace
metadata:
  name: mhr-dev
---
# One volume for everything, laid out as:
#   /workspace  source tree, synced from the dev machine
#   /gradle     Gradle cache and the downloaded Minecraft/Fabric artifacts
#   /server     the dedicated server's game directory, including mods/
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mhr-data
  namespace: mhr-dev
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 40Gi
---
# Where builds happen. Does nothing on its own; scripts/dev.sh execs into it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mhr-build
  namespace: mhr-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mhr-build
  template:
    metadata:
      labels:
        app: mhr-build
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: build
          # JDK 25, not 21: Fabric Loom 1.18 refuses to run on anything older, even
          # though the mod itself is compiled for Java 21 (see build.gradle).
          image: gradle:jdk25
          command: ["sleep", "infinity"]
          env:
            - name: GRADLE_USER_HOME
              value: /pvc/gradle
          volumeMounts:
            - name: data
              mountPath: /pvc
          # The build and gametest locks are separate on purpose, so a build and a test run can
          # both be at their peak at the same time — and the dev server is up underneath them.
          # The three memory ceilings are therefore sized to sit alongside each other rather than
          # one at a time: 5 + 7 + 3 fits the eero-pc node's 15.5Gi with room for k3s itself. A
          # ceiling that only holds when nothing else is running fails as an OOM kill in the
          # middle of a run, which reads as a flaky test rather than as a full node.
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "6"
              memory: 5Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mhr-data
---
# Where the automated gameplay tests run. The build image plus a virtual display and a software
# OpenGL driver, because the client GameTests start a real Minecraft client. Those are baked into
# k8s/gametest.Dockerfile rather than installed on every pod start.
#
# It runs as root so that the startup script can chown the directories it makes on the shared
# volume. scripts/dev.sh drops back to uid 1000 before running Gradle, so nothing root-owned ever
# lands in the Gradle cache the build pod shares.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mhr-gametest
  namespace: mhr-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mhr-gametest
  template:
    metadata:
      labels:
        app: mhr-gametest
    spec:
      containers:
        - name: gametest
          # Built from k8s/gametest.Dockerfile and imported straight into the node's containerd
          # by `scripts/dev.sh image`. Bump the tag when the Dockerfile changes.
          image: mhr-gametest:1
          # Never, not IfNotPresent: there is no registry to pull this from, so a missing image
          # is a missing `scripts/dev.sh image`, and ErrImageNeverPull says that immediately
          # instead of after a pointless trip to Docker Hub.
          imagePullPolicy: Never
          command: ["bash", "-c"]
          args:
            - |
              set -eu
              mkdir -p /pvc/gametest/workspace /pvc/gametest/home /pvc/gradle-gametest
              chown 1000:1000 /pvc/gametest /pvc/gametest/workspace /pvc/gametest/home /pvc/gradle-gametest
              touch /tmp/gametest-ready
              exec sleep infinity
          env:
            # Its own Gradle cache, not the build pod's. They would otherwise fight over the
            # same lock files, and a test run that fails because someone else pressed `go` is
            # worse than downloading Minecraft a second time.
            - name: GRADLE_USER_HOME
              value: /pvc/gradle-gametest
            # Mesa's software rasteriser. No GPU in the cluster, and the tests only need the
            # client to render *something* — they assert on game state, not on pixels.
            - name: LIBGL_ALWAYS_SOFTWARE
              value: "1"
            - name: MESA_LOADER_DRIVER_OVERRIDE
              value: llvmpipe
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/gametest-ready"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: data
              mountPath: /pvc
          # The largest of the three, because a client GameTest run is three JVMs at once: gradle,
          # the dedicated test server and a real Minecraft client. See the build pod above for how
          # the three ceilings are sized against each other.
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "6"
              memory: 7Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mhr-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mhr-server
  namespace: mhr-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mhr-server
  template:
    metadata:
      labels:
        app: mhr-server
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: server
          image: itzg/minecraft-server:latest
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: FABRIC
            - name: VERSION
              value: "26.3"
            - name: FABRIC_LOADER_VERSION
              value: "0.19.5"
            # 2G, not 3G: the heap has to fit inside the pod's memory limit with the JVM's own
            # non-heap overhead on top, or the kernel OOM-kills the server rather than the JVM
            # collecting. See the build pod for why the limit is where it is.
            - name: MEMORY
              value: 2G
            # Reachable only through a port-forward, so skip Mojang auth and let any
            # username in. Do not expose this server to a real network.
            - name: ONLINE_MODE
              value: "FALSE"
            - name: DIFFICULTY
              value: normal
            - name: MODE
              value: survival
            - name: OP_PERMISSION_LEVEL
              value: "4"
            - name: VIEW_DISTANCE
              value: "8"
            # Fresh world every restart would be closer to the mod's idea of a run,
            # but it makes debugging harder. Delete the world by hand instead:
            #   scripts/dev.sh newworld
            - name: STOP_SERVER_ANNOUNCE_DELAY
              value: "5"
          ports:
            - name: minecraft
              containerPort: 25565
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: server
          readinessProbe:
            exec:
              command: ["mc-health"]
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 40
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "3"
              memory: 3Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mhr-data
---
apiVersion: v1
kind: Service
metadata:
  name: mhr-server
  namespace: mhr-dev
spec:
  selector:
    app: mhr-server
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
