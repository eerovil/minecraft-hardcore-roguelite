---
apiVersion: v1
kind: Namespace
metadata:
  name: mhr-dev
---
# One volume for everything, laid out as:
#   /workspace  source tree, synced from the dev machine
#   /gradle     Gradle cache and the downloaded Minecraft/Fabric artifacts
#   /server     the dedicated server's game directory, including mods/
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mhr-data
  namespace: mhr-dev
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 40Gi
---
# Where builds happen. Does nothing on its own; scripts/dev.sh execs into it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mhr-build
  namespace: mhr-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mhr-build
  template:
    metadata:
      labels:
        app: mhr-build
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: build
          # JDK 25, not 21: Fabric Loom 1.18 refuses to run on anything older, even
          # though the mod itself is compiled for Java 21 (see build.gradle).
          image: gradle:jdk25
          command: ["sleep", "infinity"]
          env:
            - name: GRADLE_USER_HOME
              value: /pvc/gradle
          volumeMounts:
            - name: data
              mountPath: /pvc
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "6"
              memory: 8Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mhr-data
---
# Where the automated gameplay tests run. Same image as the build pod, plus a virtual display and
# a software OpenGL driver, because the client GameTests start a real Minecraft client.
#
# It runs as root only so that apt-get can install those at startup; the image has no way to bake
# them in. scripts/dev.sh drops back to uid 1000 before running Gradle, so nothing root-owned ever
# lands in the Gradle cache the build pod shares.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mhr-gametest
  namespace: mhr-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mhr-gametest
  template:
    metadata:
      labels:
        app: mhr-gametest
    spec:
      containers:
        - name: gametest
          image: gradle:jdk25
          command: ["bash", "-c"]
          args:
            - |
              set -eu
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                xvfb x11-utils mesa-utils \
                libgl1-mesa-dri libglx-mesa0 libglu1-mesa libegl-mesa0 \
                libx11-6 libxext6 libxrender1 libxrandr2 libxi6 libxcursor1 \
                libxinerama1 libxfixes3 libxkbcommon0 libasound2t64
              mkdir -p /pvc/gametest/workspace /pvc/gametest/home /pvc/gradle-gametest
              chown 1000:1000 /pvc/gametest /pvc/gametest/workspace /pvc/gametest/home /pvc/gradle-gametest
              touch /tmp/gametest-ready
              exec sleep infinity
          env:
            # Its own Gradle cache, not the build pod's. They would otherwise fight over the
            # same lock files, and a test run that fails because someone else pressed `go` is
            # worse than downloading Minecraft a second time.
            - name: GRADLE_USER_HOME
              value: /pvc/gradle-gametest
            # Mesa's software rasteriser. No GPU in the cluster, and the tests only need the
            # client to render *something* — they assert on game state, not on pixels.
            - name: LIBGL_ALWAYS_SOFTWARE
              value: "1"
            - name: MESA_LOADER_DRIVER_OVERRIDE
              value: llvmpipe
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/gametest-ready"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: data
              mountPath: /pvc
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "6"
              memory: 8Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mhr-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mhr-server
  namespace: mhr-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mhr-server
  template:
    metadata:
      labels:
        app: mhr-server
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: server
          image: itzg/minecraft-server:latest
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: FABRIC
            - name: VERSION
              value: "26.3"
            - name: FABRIC_LOADER_VERSION
              value: "0.19.5"
            - name: MEMORY
              value: 3G
            # Reachable only through a port-forward, so skip Mojang auth and let any
            # username in. Do not expose this server to a real network.
            - name: ONLINE_MODE
              value: "FALSE"
            - name: DIFFICULTY
              value: normal
            - name: MODE
              value: survival
            - name: OP_PERMISSION_LEVEL
              value: "4"
            - name: VIEW_DISTANCE
              value: "8"
            # Fresh world every restart would be closer to the mod's idea of a run,
            # but it makes debugging harder. Delete the world by hand instead:
            #   scripts/dev.sh newworld
            - name: STOP_SERVER_ANNOUNCE_DELAY
              value: "5"
          ports:
            - name: minecraft
              containerPort: 25565
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: server
          readinessProbe:
            exec:
              command: ["mc-health"]
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 40
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "4"
              memory: 5Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mhr-data
---
apiVersion: v1
kind: Service
metadata:
  name: mhr-server
  namespace: mhr-dev
spec:
  selector:
    app: mhr-server
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
